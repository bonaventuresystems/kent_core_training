<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <script>
      var counter = 0;
      function SayHello() {
        counter = counter + 1;
        console.log(counter);
      }
    </script>
    <script>
      var arr = new Array();

      function KeepCalling() {
        var num = window.setInterval(SayHello, 1000);
        arr.push(num);
      }

      function StopCalling() {
        for (let index = 0; index < arr.length; index++) {
          const queNo = arr[index];
          window.clearInterval(queNo);
        }
      }
    </script>
    <script>
      function Disturb() {
        //alert("6767");
        clearInterval(num);
      }
    </script>
    <button onclick="KeepCalling()">Start New Queue</button>
    <button onclick="StopCalling()">Clean A Queue</button>
  </body>
</html>
